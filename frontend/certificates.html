<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificate Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        const certificates = [
            { id: 1, name: 'Internship', category: 'Experience', issuer: 'Kuensel Corporation of Bhutan', link: 'images/certificates/kuensel recommendation.jpg', type: 'image' },
            { id: 2, name: 'Coding Basics', category: 'Training', issuer: 'Desuung Skilling Program', link: 'images/certificates/coding.pdf', type: 'pdf' },
            { id: 4, name: 'Data Science', category: 'Training', issuer: 'Desuung Skilling Program', link: 'images/certificates/Data Science.pdf', type: 'pdf' },
            { id: 5, name: 'BSD', category: 'Training', issuer: 'BSD Education', link: 'images/certificates/bsd.png', type: 'image' },
            { id: 6, name: 'Harnessing Data With Power BI', category: 'Training', issuer: 'Microsoft', link: 'images/certificates/harnessing data.png', type: 'image' },
            { id: 7, name: 'ICT Foundation', category: 'Training', issuer: 'Desuung Skilling Program', link: 'images/certificates/ICT Foundation.pdf', type: 'pdf' },
            { id: 8, name: 'Intermediate Python', category: 'Training', issuer: 'Solo learn', link: 'images/certificates/python intermediate.jpg', type: 'image' },
            { id: 9, name: 'Intermediate SQL', category: 'Training', issuer: 'Solo learn', link: 'images/certificates/sql intermediate.jpeg', type: 'image' },
            { id: 10, name: 'Desuung', category: 'Experience', issuer: 'Desuung Organization', link: 'images/certificates/Desuung.png', type: 'image' },
            { id: 11, name: 'Software Developer(2024 - ongoing)', category: 'Experience', issuer: 'iBEST Technologies', link: 'images/certificates/logo.png', type: 'image' },
        ];

        function renderCertificates(filterCategory = 'All') {
            const listContainer = document.getElementById('certificate-list');
            listContainer.innerHTML = '';
            
            const filteredCerts = certificates.filter(cert => 
                filterCategory === 'All' || cert.category === filterCategory
            );

            filteredCerts.forEach(cert => {
                const listItem = document.createElement('li');
                listItem.className = 'p-3 hover:bg-indigo-50 cursor-pointer border-b transition duration-150 ease-in-out';
                listItem.setAttribute('data-id', cert.id);

                listItem.innerHTML = `
                    <h3 class="font-semibold text-gray-800">${cert.name}</h3>
                    <p class="text-xs text-gray-500">${cert.issuer} | ${cert.date}</p>
                `;
                listItem.onclick = () => selectCertificate(cert.id);
                listContainer.appendChild(listItem);
            });
            
            document.getElementById('cert-count').textContent = filteredCerts.length;

            if (filteredCerts.length > 0) {
                selectCertificate(filteredCerts[0].id);
            } else {
                clearDetails();
            }
        }

        function selectCertificate(certId) {
            const cert = certificates.find(c => c.id === certId);
            if (!cert) return;

            document.getElementById('detail-name').textContent = cert.name;
            document.getElementById('detail-issuer').textContent = cert.issuer;
            document.getElementById('detail-date').textContent = cert.date;
            document.getElementById('detail-category').textContent = cert.category;
            document.getElementById('download-link').href = cert.link;

            const viewer = document.getElementById('certificate-viewer');
            viewer.innerHTML = '';

            if (cert.type === 'image') {
                viewer.innerHTML = `
                    <img 
                        src="${cert.link}" 
                        alt="${cert.name}" 
                        class="certificate-img"
                    >
                `;
            } else {
                viewer.innerHTML = `
                    <iframe 
                        src="${cert.link}" 
                        class="certificate-pdf" 
                        title="${cert.name}"
                    ></iframe>
                `;
            }

            document.querySelectorAll('#certificate-list li').forEach(li => {
                li.classList.remove('bg-indigo-100', 'font-bold');
                if (parseInt(li.getAttribute('data-id')) === certId) {
                    li.classList.add('bg-indigo-100', 'font-bold');
                }
            });
        }

        function clearDetails() {
            document.getElementById('detail-name').textContent = 'No Certificate Selected';
            document.getElementById('detail-issuer').textContent = '';
            document.getElementById('detail-date').textContent = '';
            document.getElementById('detail-category').textContent = '';
            document.getElementById('download-link').href = '#';

            document.getElementById('certificate-viewer').innerHTML = `
                <p class="text-gray-500">Select a certificate from the list to view its details.</p>
            `;
        }

        function filterCategory(category, button) {
            document.querySelectorAll('#category-filters button').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            button.classList.add('bg-indigo-600', 'text-white');
            button.classList.remove('bg-gray-200', 'text-gray-700');

            renderCertificates(category);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const allButton = document.querySelector('[data-category="All"]');
            filterCategory('All', allButton);
        });
    </script>

    <style>
        .certificate-display-container {
            min-height: 200px;
            height: 65vh;
            max-height: 80vh;
        }

        /* RESPONSIVE IMAGE FIX */
        .certificate-img {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
        }

        /* RESPONSIVE PDF FIX */
        .certificate-pdf {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden min-h-[80vh]">
        
        <header class="bg-indigo-700 text-white p-4 sm:p-6 flex justify-between items-center">
            <a href="index.html" class="text-white text-2xl sm:text-3xl mr-4 hover:text-indigo-200 transition duration-150" title="Go back to main page">
                    &larr; 
                </a>
            <h1 class="text-2xl sm:text-3xl font-bold">My Certificate Library</h1>
            <p class="text-lg font-semibold"><span id="cert-count">0</span> Certificates</p>
        </header>

        <div class="lg:grid lg:grid-cols-4 min-h-[calc(80vh-72px)]">

            <aside class="lg:col-span-1 border-r border-gray-200 bg-gray-50 p-4">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Categories</h2>

                <div id="category-filters" class="flex flex-wrap gap-2 mb-6">
                    <button onclick="filterCategory('All', this)" data-category="All" class="py-1 px-3 rounded-full text-sm bg-gray-200 text-gray-700">All</button>
                    <button onclick="filterCategory('Training', this)" data-category="Training" class="py-1 px-3 rounded-full text-sm bg-gray-200 text-gray-700">Training</button>
                    <button onclick="filterCategory('Experience', this)" data-category="Experience" class="py-1 px-3 rounded-full text-sm bg-gray-200 text-gray-700">Experience</button>
                </div>
                
                <h2 class="text-xl font-semibold text-gray-800 mb-2">Certificate List</h2>

                <ul id="certificate-list" class="bg-white border rounded-lg max-h-96 overflow-y-auto divide-gray-100"></ul>
            </aside>

            <section class="lg:col-span-3 p-6 sm:p-8">
                <h2 id="detail-name" class="text-2xl sm:text-3xl font-extrabold text-indigo-700 mb-4">No Certificate Selected</h2>

                <div class="flex flex-wrap gap-4 mb-8 text-sm sm:text-base">
                    <div><span class="text-gray-500">Issuer:</span> <span id="detail-issuer" class="font-medium text-gray-800"></span></div>
                    <div><span class="text-gray-500"></span> <span id="detail-date" class="font-medium text-gray-800"></span></div>
                    <div><span class="text-gray-500">Category:</span> <span id="detail-category" class="px-2 py-0.5 bg-green-100 text-green-800 rounded-full font-medium text-xs"></span></div>
                </div>

                <div class="certificate-display-container bg-gray-200 border-4 border-gray-300 rounded-lg shadow-xl flex items-center justify-center p-2 mb-6 max-w-4xl mx-auto w-full">
                    <div id="certificate-viewer" class="w-full h-full flex items-center justify-center">
                        <p class="text-gray-500">Select a certificate from the list to view its details.</p>
                    </div>
                </div>

                <div class="text-center">
                    <a id="download-link" href="#" download class="inline-block bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded transition">Download Certificate File</a>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
